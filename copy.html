<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Braj Greens</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #fff;
      }

      .story-section {
        width: 100%;
        height: 540px;
        position: relative;
        overflow: hidden;
      }

      /* Background Image */
      .story-section img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Dark Overlay */
      .story-section::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.42);
      }

      /* Blue Content Box */
      .story-content {
        position: absolute;
        top: 50%;
        left: 8%;
        transform: translateY(-50%);
        width: 720px;
        background: rgba(0, 140, 255, 0.78);
        padding: 48px 36px;
        z-index: 2;
        backdrop-filter: blur(2px);
      }

      .story-content h1 {
        color: #fff;
        font-size: 64px;
        font-weight: 800;
        line-height: 1.05;
        margin-bottom: 28px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .story-content h3 {
        color: #fff;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 24px;
      }

      .story-content p {
        color: #fff;
        font-size: 19px;
        line-height: 1.7;
        max-width: 590px;
        margin-bottom: 35px;
        font-weight: 400;
      }

      /* Button */
      .story-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 260px;
        height: 62px;
        background: #6a6a6a;
        color: #fff;
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        text-transform: uppercase;
        transition: 0.3s ease;
        letter-spacing: 0.5px;
      }

      .story-btn:hover {
        background: #4f4f4f;
      }

      /* Responsive */

      @media (max-width: 992px) {
        .story-section {
          height: 650px;
        }

        .story-content {
          width: 90%;
          left: 5%;
          padding: 38px 24px;
        }

        .story-content h1 {
          font-size: 48px;
        }

        .story-content h3 {
          font-size: 22px;
        }

        .story-content p {
          font-size: 16px;
        }
      }

      @media (max-width: 600px) {
        .story-section {
          height: 760px;
        }

        .story-content {
          top: auto;
          bottom: 35px;
          transform: none;
        }

        .story-content h1 {
          font-size: 34px;
        }

        .story-content h3 {
          font-size: 18px;
        }

        .story-content p {
          font-size: 15px;
          line-height: 1.6;
        }

        .story-btn {
          width: 210px;
          height: 54px;
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <section class="story-section">
      <!-- Background Image -->
      <img
        src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fGluZGlhbiUyMGZhbWlseXxlbnwwfHwwfHx8MA%3D%3D"
        alt="Braj Greens"
      />

      <!-- Content Box -->
      <div class="story-content">
        <h1>WELCOME TO BRAJ GREENS</h1>

        <h3>A Premium Living Experience by Kriti Realty</h3>

        <p>
          Where modern living meets trust, comfort, and timeless value. Discover
          thoughtfully planned spaces designed for peaceful living, future
          growth, and a better tomorrow.
        </p>

        <a href="#" class="story-btn">READ MORE</a>
      </div>
    </section>
  </body>
</html>
