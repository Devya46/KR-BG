<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Luxury Flag Banner | Invest Today</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .body-banner {
        background: white;
        min-height: 50vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      /* ----- FLAG BANNER (smaller height, elegant flag shape) ----- */
      .flag-invest-card {
        position: relative;
        width: 100%;
        max-width: 1280px;
        /* compact height as requested — elegant but not oversized */
        height: 420px;

        /* DYNAMIC FLAG SHAPE with soft waves — premium & modern */
        clip-path: path(
          "M 0 42 
         C 85 18, 170 8, 265 28 
         C 375 52, 495 78, 620 52 
         C 755 24, 870 14, 1010 38 
         C 1105 54, 1175 68, 1280 42 
         L 1280 378 
         C 1175 408, 1085 432, 975 412 
         C 840 386, 710 362, 580 388 
         C 450 414, 320 440, 185 422 
         C 95 408, 38 394, 0 378 
         Z"
        );
        border-radius: 28px 28px 32px 32px;
        box-shadow:
          0 30px 55px -18px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(230, 195, 110, 0.25) inset;
        transition:
          box-shadow 0.35s ease,
          transform 0.2s ease;
        overflow: hidden;
        isolation: isolate;
      }

      .flag-invest-card:hover {
        box-shadow:
          0 38px 70px -18px rgba(0, 0, 0, 0.85),
          0 0 0 1.5px rgba(240, 200, 100, 0.45) inset;
      }

      /* Background image layer — high-end property */
      .flag-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        will-change: transform;
      }

      .flag-invest-card:hover .flag-image {
        transform: scale(1.06);
      }

      /* Overlay with deep luxurious gradient */
      .flag-overlay-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          98deg,
          rgba(0, 0, 0, 0.82) 0%,
          rgba(0, 0, 0, 0.58) 35%,
          rgba(0, 0, 0, 0.38) 65%,
          rgba(0, 0, 0, 0.5) 100%
        );
        z-index: 2;
        pointer-events: none;
        border-radius: inherit;
      }

      /* Gold shimmer animation — subtle luxury movement */
      .gold-shimmer {
        position: absolute;
        inset: 0;
        z-index: 3;
        overflow: hidden;
        border-radius: inherit;
        pointer-events: none;
      }

      .gold-shimmer::before {
        content: "";
        position: absolute;
        top: -30%;
        left: -50%;
        width: 200%;
        height: 150%;
        background: linear-gradient(
          125deg,
          rgba(255, 240, 170, 0) 5%,
          rgba(230, 200, 95, 0.08) 28%,
          rgba(250, 225, 130, 0.16) 48%,
          rgba(255, 245, 190, 0.05) 70%,
          transparent 88%
        );
        transform: rotate(18deg);
        animation: luxurySheen 10s linear infinite;
        filter: blur(4px);
      }

      @keyframes luxurySheen {
        0% {
          transform: translateX(-90%) rotate(18deg);
        }
        50% {
          transform: translateX(15%) rotate(18deg);
        }
        100% {
          transform: translateX(150%) rotate(18deg);
        }
      }

      /* ----- CONTENT SECTION (headline + desc + button) ----- */
      .hero-content {
        position: absolute;
        z-index: 12;
        left: 6%;
        top: 50%;
        transform: translateY(-50%);
        max-width: 540px;
        width: 88%;
        color: #ffffff;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.25);
        pointer-events: auto;
      }

      /* Micro badge (elegant) */
      .micro-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(20, 20, 30, 0.48);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(230, 190, 105, 0.55);
        padding: 0.5rem 1.4rem;
        border-radius: 40px;
        font-size: 0.7rem;
        letter-spacing: 1.2px;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 1.3rem;
        color: #f8e5bf;
        width: fit-content;
      }

      .micro-badge::before {
        content: "";
        width: 8px;
        height: 8px;
        background: #eac477;
        border-radius: 50%;
        box-shadow: 0 0 8px #f5cf8a;
        animation: gentlePulse 1.8s infinite;
      }

      @keyframes gentlePulse {
        0% {
          opacity: 0.7;
          transform: scale(0.9);
        }
        100% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* Main headline */
      .main-headline {
        font-size: clamp(2rem, 6vw, 3.8rem);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        margin-bottom: 0.9rem;
      }

      .gold-span {
        color: #f2cf8c;
        font-style: italic;
        font-weight: 600;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }

      /* description text */
      .property-desc {
        font-size: clamp(0.9rem, 2.8vw, 1rem);
        line-height: 1.55;
        color: rgba(255, 250, 235, 0.92);
        margin-bottom: 1.8rem;
        max-width: 480px;
        font-weight: 450;
        letter-spacing: 0.2px;
      }

      /* CTA Button — Book Consultation */
      .btn-consult {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #ffffff;
        padding: 0.85rem 2rem 0.85rem 2.2rem;
        border-radius: 60px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        color: #121212;
        transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        box-shadow: 0 12px 18px -12px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(230, 195, 110, 0.8);
        backdrop-filter: blur(2px);
      }

      .btn-consult:hover {
        /* transform: translateY(-4px); */
        background: #fffaf0;
        gap: 18px;
        box-shadow: 0 20px 28px -14px rgba(0, 0, 0, 0.45);
        border-color: #eac16e;
      }

      .btn-icon {
        background: #101012;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
        color: #eac47c;
        font-size: 1.2rem;
        font-weight: 500;
      }

      .btn-consult:hover .btn-icon {
        background: #eac47c;
        color: #0f0f12;
        /* transform: rotate(45deg); */
      }

      /* floating card - small appreciation stat (elegant touch) */
      .stat-appreciation {
        position: absolute;
        z-index: 12;
        right: 5%;
        bottom: 12%;
        width: 240px;
        background: rgba(12, 14, 18, 0.55);
        backdrop-filter: blur(18px);
        border-radius: 1.8rem;
        padding: 1.2rem 1.5rem;
        border: 1px solid rgba(220, 180, 90, 0.45);
        box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
        transition: all 0.25s ease;
        animation: floatSoft 5s ease-in-out infinite;
        pointer-events: auto;
      }

      .stat-appreciation:hover {
        background: rgba(20, 20, 28, 0.75);
        border-color: rgba(230, 188, 100, 0.75);
        animation-play-state: paused;
      }

      .stat-number {
        font-size: 2.4rem;
        font-weight: 800;
        color: #f4d58c;
        line-height: 1.2;
        letter-spacing: -0.5px;
        font-family: "Inter", sans-serif;
        margin-bottom: 0.3rem;
      }

      .stat-text {
        font-size: 0.7rem;
        line-height: 1.45;
        color: rgba(255, 248, 225, 0.85);
        font-weight: 450;
        letter-spacing: 0.2px;
      }

      @keyframes floatSoft {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      /* ========= RESPONSIVE DESIGN (mobile + tablet) ========= */
      @media (max-width: 1050px) {
        .flag-invest-card {
          height: 400px; /* keep smaller height */
          clip-path: path(
            "M 0 38 
           C 80 20, 165 12, 255 30 
           C 365 52, 495 76, 620 50 
           C 750 24, 870 16, 1005 36 
           C 1095 50, 1165 62, 1280 38 
           L 1280 358 
           C 1175 386, 1085 408, 975 390 
           C 840 366, 710 344, 580 368 
           C 450 392, 320 416, 185 400 
           C 95 388, 40 376, 0 358 Z"
          );
        }
        .stat-appreciation {
          right: 3%;
          bottom: 12%;
          width: 220px;
          padding: 1rem 1.3rem;
        }
        .hero-content {
          left: 5%;
        }
      }

      /* Tablet styles (landscape + portrait) */
      @media (max-width: 880px) {
        .flag-invest-card {
          height: 440px;
          clip-path: none;
          border-radius: 32px;
        }

        .hero-content {
          position: relative;
          top: auto;
          transform: none;
          left: 0;
          margin: 0 auto;
          padding: 2rem 2rem 1rem;
          width: 100%;
          max-width: 95%;
          text-align: left;
          background: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.65),
            rgba(0, 0, 0, 0.25)
          );
          border-radius: 28px;
          backdrop-filter: blur(2px);
        }

        .flag-invest-card {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          height: auto;
          min-height: 480px;
        }

        .flag-image {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: 0;
        }

        .flag-invest-card {
          position: relative;
          overflow: hidden;
        }

        .hero-content {
          position: relative;
          z-index: 15;
          margin-bottom: 1.5rem;
          margin-top: 2rem;
        }

        .stat-appreciation {
          position: relative;
          bottom: auto;
          right: auto;
          margin: 0.5rem auto 1.8rem auto;
          width: 85%;
          max-width: 280px;
          left: 0;
          animation: floatSoft 4s infinite;
        }

        .flag-overlay-gradient {
          background: linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.8) 15%,
            rgba(0, 0, 0, 0.4) 70%
          );
        }

        .main-headline {
          font-size: 2.4rem;
        }

        .property-desc {
          font-size: 0.95rem;
        }
      }

      /* Mobile (small devices) */
      @media (max-width: 600px) {
        body {
          padding: 0.9rem;
        }
        .flag-invest-card {
          min-height: 460px;
          border-radius: 28px;
        }
        .hero-content {
          padding: 1.5rem 1.3rem 0.8rem;
        }
        .main-headline {
          font-size: 1.9rem;
          line-height: 1.25;
        }
        .property-desc {
          font-size: 0.85rem;
          margin-bottom: 1.4rem;
        }
        .btn-consult {
          padding: 0.7rem 1.6rem;
          font-size: 0.85rem;
        }
        .btn-icon {
          width: 28px;
          height: 28px;
          font-size: 1rem;
        }
        .micro-badge {
          padding: 0.4rem 1.1rem;
          font-size: 0.6rem;
          margin-bottom: 1rem;
        }
        .stat-appreciation {
          width: 88%;
          padding: 0.9rem 1.2rem;
          margin-top: 0rem;
          margin-bottom: 1.2rem;
        }
        .stat-number {
          font-size: 2rem;
        }
        .stat-text {
          font-size: 0.65rem;
        }
      }

      @media (max-width: 480px) {
        .flag-invest-card {
          min-height: 500px;
        }
        .main-headline {
          font-size: 1.7rem;
        }
        .hero-content {
          padding: 1.2rem 1rem 0.5rem;
        }
        .btn-consult {
          gap: 8px;
          padding: 0.65rem 1.3rem;
        }
      }

      /* ensure container background blends */
      .flag-image {
        display: block;
      }

      /* additional font import */
      @import url("https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap");
    </style>
  </head>
  <body>
    <section class="body-banner">
      <div class="flag-invest-card">
        <!-- Premium imagery (high-end real estate) -->
        <img
          class="flag-image"
          src="https://images.pexels.com/photos/2587054/pexels-photo-2587054.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&fit=crop"
          alt="Luxury real estate investment property"
          loading="eager"
        />

        <!-- Overlay layers -->
        <div class="flag-overlay-gradient"></div>
        <div class="gold-shimmer"></div>

        <!-- Core Text Content: Invest Today for a Better Tomorrow -->
        <div class="hero-content">
          <div class="micro-badge">PREMIUM REALTY</div>
          <h1 class="main-headline">
            Invest Today for a<br />
            <span class="gold-span">Better Tomorrow</span>
          </h1>
          <p class="property-desc">
            Find premium properties with strong future growth and secure
            investment opportunities.
          </p>
          <a href="#" class="btn-consult">
            Book Consultation
            <span class="btn-icon">→</span>
          </a>
        </div>

        <!-- floating stat to reinforce value (optional but adds premium feel) -->
        <div class="stat-appreciation">
          <div class="stat-number">+22.8%</div>
          <div class="stat-text">
            Projected annual growth in prime locations — limited portfolio
            access
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
